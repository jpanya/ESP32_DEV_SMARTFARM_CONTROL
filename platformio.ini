; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; SPIFFS Configuration
board_build.filesystem = spiffs
board_build.partitions = default.csv

; OLED Display Libraries (SSD1306 Driver for I2C)
lib_deps = 
    adafruit/Adafruit GFX Library@^1.11.3
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit BusIO@^1.14.1

    ; WiFi Manager Library for ESP32
    tzapu/WiFiManager@^2.0.17

    ; DS18B20 Temperature Sensor Library
        paulstoffregen/OneWire@^2.3.7
        milesburton/DallasTemperature@^3.9.0

        ; Modbus RTU Library for XY-MD03 Temperature & Humidity Sensor
            4-20ma/ModbusMaster@^2.0.1

    ; ArduinoJson for parsing OpenWeather API responses
    bblanchon/ArduinoJson@^7.2.0

    ; Async Web Server for ESP32 Dashboard
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git

; I2C Configuration for OLED
build_flags = 
    -D I2C_SDA=21
    -D I2C_SCL=22
    -D OLED_RESET=5
    -D SCREEN_WIDTH=128
    -D SCREEN_HEIGHT=64
    -D OLED_ADDRESS=0x3C
    -Wno-deprecated-declarations
